services:
  postgres:
    image: postgres:16
    container_name: asset-tracker-db
    environment:
      POSTGRES_DB: asset_tracker
      POSTGRES_USER: asset_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_user -d asset_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: asset-tracker-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/asset_tracker
      SPRING_DATASOURCE_USERNAME: asset_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
    ports:
      - "8080:8080"
    networks:
      - asset-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  asset-network:
    driver: bridge
